<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Newsreader:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Stylesheets/login.css">
</head>
<body class="auth">
  <main class="auth-card">
    <img class="logo" src="../images/activityfinder.png" alt="Activity Finder Logo">
    <h1>Welcome back</h1>
    <p class="lede">Sign in to find what's happening near you.</p>

    <form id="loginForm">
      <label class="field">
        <span>Email</span>
        <input type="text" placeholder="you@example.com" id="lemail" autocomplete="email"/>
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" placeholder="Password" id="lpassword" autocomplete="current-password"/>
      </label>

      <button class="primary red" type="submit">Log in</button>

      <div class="auth-links">
        <span></span>
        <a class="register" href="../HTMLS/registerpage.html">Create an account</a>
      </div>
    </form>
  </main>
  <script type="module" src="../Scripts/firebase.js"></script>
</body>
</html>
