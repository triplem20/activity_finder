<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Finder</title>
    <link rel="stylesheet" href="../Stylesheets/login.css">
    <link href='https://fonts.googleapis.com/css?family=Montserrat:700' rel='stylesheet' type='text/css'>

    
   

</head>
<body>

    
    <div class="appbar">
        <a href="../HTMLS/ActivityFinder.html"><h1>Activity Finder <img class="headicon" src="../images/activityfinder.png"></h1></a>
        <button id="signOutButton">Sign Out</button>
      </div>
    
     

    <div class="blog_post">
        
        <div class="img_pod">
          <img src="../images/activityfinder.png" alt="random image" id="accimg">
        </div>
        <div class="container_copy">
            <div class="headline">
                <h2 class="text-headline">Profile</h2>
                <h3 class="text-subheadline" id="usernameDisplay">Welcome, [User's Name]</h3>
            </div>
            <div class="details">
                <span>
                    <strong class="text-small-uppercase">Email:</strong>
                    <p class="text-body" id="userEmaild">[user@example.com]</p>
                </span>
                <span>
                    <strong class="text-small-uppercase">Name:</strong>
                    <p class="text-body" id="userNamed">[User's Name]</p>
                </span>
                <span>
                    <strong class="text-small-uppercase">City:</strong>
                    <p class="text-body" id="cityName">[User's City]</p> 
                </span>
               
            </div>
          <a class="btn_primary" href='#' target="_blank">Edit</a>
        </div>
        
      </div>
    


    


    <script type="module" src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database.js"></script>
    
    <script type="module" src="../Scripts/firebase.js"></script>
 

</script>
</body>
</html>
