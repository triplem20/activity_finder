<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Newsreader:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Stylesheets/ActivityFinder.css">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
</head>
<body>

    <header class="appbar">
        <h1><img class="headicon" src="../images/activityfinder.png" alt=""> Activity Finder</h1>
        <div class="actions">
            <a class="iconbtn profile" href="../HTMLS/useraccount.html" title="Account"><img src="../images/personicon.png" alt="Account"></a>
            <button class="iconbtn" title="Sign Out" id="signOutButton"><img src="../images/signout.png" alt="Sign out"></button>
        </div>
    </header>

<div class="layout">

    <div id="map">
        <div class="Search">
            <input type="text" id="mapSearchInput" placeholder="Search for a location">
            <button type="button" id="mapSearchBtn">Search</button>
        </div>

        <div class="filter-mood">
          <div class="dropdown">
            <input type="checkbox" id="dropdown">

            <label class="dropdown__face" for="dropdown">
              <div class="dropdown__text">Mood</div>
              <div class="dropdown__arrow"></div>
            </label>

            <ul class="dropdown__items">
              <li title="Adventurous" data-type="adventure">🧗 </li>
              <li title="Relaxed" data-type="relax">🌅 </li>
              <li title="Creative" data-type="creative">🎨 </li>
              <li title="Social/Romantic" data-type="social">🍻 </li>
              <li title="Smart" data-type="libary">📚 </li>
              <li title="Nature/Festive" data-type="nature">🌳 </li>
            </ul>
          </div>
        </div>

        <div class="filter-section">
            <button title="Restaurants" id="restaurantsFilter"><img src="../images/resturanticon.png" alt="">Restaurants</button>
            <button title="Sports" id="sportsFilter"><img src="../images/sportsicon.png" alt="">Sports</button>
            <button title="Other Activities" id="eventsFilter"><img src="../images/eventsicon.png" alt="">Other</button>
        </div>

        <button title="Locate Me" id="locate-btn"><img src="../images/locationicon.png" alt="Locate me"></button>
        <button id="addActivityBtn"><img src="../images/addlocation.png" alt="">Add activity</button>
    </div>

    <aside class="sidebar">
        <div id="activityFormModal" class="modal">
            <span class="close">&times;</span>
            <div class="modal-content">

              <h3 id="modal-title">Add New Activity</h3>
              <form id="activityForm">
                <div class="row">
                  <div class="col-25">
                    <label for="activityName">Activity Name</label>
                  </div>
                  <div class="col-75">
                    <input type="text" id="activityName" placeholder="Activity Name" required>
                  </div>
                </div>

                <div class="row">
                  <div class="col-25">
                    <label for="activityLocation">Location</label>
                  </div>
                  <div class="col-75">
                    <input type="text" id="activityLocation" placeholder="Enter address or lat,lng" required> <button type="button" id="pickLocationBtn">Pick on Map</button>
                  </div>
                </div>

                <div class="row">
                  <div class="col-25">
                    <label for="activityType">Activity Type</label>
                  </div>
                  <div class="col-75">
                    <select id="activityType" required>
                      <option value="restaurant">Restaurant</option>
                      <option value="sports">Sports</option>
                      <option value="event">Event</option>
                      <option value="marathon">Marathon</option>
                    </select>
                  </div>
                </div>

                <div id="marathonPoints" style="display: none;">
                  <div class="row">
                    <div class="col-25">
                      <label for="startLocation">Start Location</label>
                    </div>
                    <div class="col-75">
                      <input type="text" id="startLocation" placeholder="Enter start address or coordinates">
                      <button type="button" id="pickStartBtn">Pick Start on Map</button>
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-25">
                      <label for="endLocation">End Location</label>
                    </div>
                    <div class="col-75">
                      <input type="text" id="endLocation" placeholder="Enter end address or coordinates">
                      <button type="button" id="pickEndBtn">Pick End on Map</button>
                    </div>
                  </div>
                </div>

                <div class="row">
                  <input type="submit" id="addActivity" value="Add Activity" class="addActivity">
                </div>
              </form>
            </div>
        </div>

        <h5 class="NearbyA">Nearby activities</h5>
        <div id="loadingIndicator" style="display: none;" class="lds-facebook"><div></div><div></div><div></div></div>
        <div class="activity-list" id="activityList">
            <!-- Activities will be listed here dynamically -->
        </div>
        <p class="attribution">Place data by <a href="https://foursquare.com" target="_blank" rel="noopener">Foursquare</a></p>
    </aside>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
<script src="https://unpkg.com/leaflet-routing-graphhopper@1.2.0/dist/leaflet-routing-graphhopper.js"></script>
<script type="module" src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js"></script>
<script type="module" src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js"></script>
<script type="module" src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database.js"></script>
<script type="module" src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js"></script>

<script src="../Scripts/ActivityFinder.js"></script>
<script type="module" src="../Scripts/firebase.js"></script>

</body>
</html>
