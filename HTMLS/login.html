<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Newsreader:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Stylesheets/login.css">
</head>
<body class="auth">
    <main class="auth-card">
        <img class="logo" src="../images/activityfinder.png" alt="Activity Finder Logo">
        <div class="headline">
            <h2 class="text-headline">Welcome back</h2>
            <p class="lede">Sign in to find what's happening near you.</p>
        </div>
        <form id="loginForm">
            <label class="field">
                <span class="text-small-uppercase">Email</span>
                <input class="text-body" id="lemail" type="email" autocomplete="email" required>
            </label>
            <label class="field">
                <span class="text-small-uppercase">Password</span>
                <input class="text-body" id="lpassword" type="password" autocomplete="current-password" required>
            </label>
            <input id="submit" type="submit" value="Log in">
            <div class="auth-links">
                <a class="forgot" href="#">Forgot password?</a>
                <a class="register" href="../HTMLS/registerpage.html">Create an account</a>
            </div>
        </form>
    </main>
    <script type="module" src="../Scripts/firebase.js"></script>
</body>
</html>
